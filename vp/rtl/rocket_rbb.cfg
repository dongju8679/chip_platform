# rocket_rbb.cfg - OpenOCD: connect to the chipyard Verilator simulation (SimJTAG remote bitbang)
#
#   GDB --:3333--> OpenOCD --rbb(TCP)--> SimJTAG --> DebugTransportModuleJTAG
#                                                    --> DebugModule --> RocketTile
#
# The simulation picks the port arbitrarily each run (SimJTAG.cc constructs
# remote_bitbang_t(0) -> the OS assigns it). Read "Listening on port NNNNN" from
# the simulation's stderr and pass it in via the RBB_PORT environment variable.
# vp/rtl/debug.sh does this automatically.

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port [expr {[info exists env(RBB_PORT)] ? $env(RBB_PORT) : 9823}]

transport select jtag

# RISC-V DTM (debug spec 0.13). The rocket-chip default IR length is 5.
#   idcode is the chipyard default (version=0,partnum=0,manuf=0) -> 0x00000001
jtag newtap riscv cpu -irlen 5 -expected-id 0x00000001

target create riscv.cpu0 riscv -chain-position riscv.cpu

# -- Verilator burns simulation cycles for every JTAG bit, so it is very slow --
#   With the default timeout (2 s) every abstract command blows up. Raise it generously.
riscv set_command_timeout_sec 120
riscv set_reset_timeout_sec 120
# System bus access is absent in this configuration (dm-sba=0) -> go through the program buffer
riscv set_mem_access progbuf

gdb_port 3333
telnet_port 4444
tcl_port 6666

init
halt
# Tcl caution: square brackets inside echo are interpreted as command
#   substitution and kill OpenOCD with 'invalid command name "openocd"'.
#   No square brackets.
echo "openocd ready - attach with: target extended-remote :3333"
